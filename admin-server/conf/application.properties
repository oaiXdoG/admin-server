server.host=0.0.0.0
server.port=9050

# 服务注册与发现：同一套部署的服务使用同一个 path
# 运行在 win 的 Docker（dev-env/docker-compose.yml）里：redis、postgres 用服务名，zookeeper 是宿主机上的独立容器
zookeeper.address=127.0.0.1:2181
zookeeper.path=/daoshinvgui

redis.host=127.0.0.1
redis.port=6379
redis.password=daoshinvgui
redis.database=0

database.postgresql.url=jdbc:postgresql://127.0.0.1:5432/daoshinvgui_admin
database.postgresql.username=daoshinvgui
database.postgresql.password=daoshinvgui
database.postgresql.hikari.maximum-pool-size=10
database.postgresql.hikari.minimum-idle=1
database.postgresql.hikari.connection-timeout=10000

# 加密保存敏感配置（数据源签名密钥等）的密钥，修改后需要重新填写这些密钥
security.secret-key=e7ZtZ1X5RzEWqotER11xa47bjxAbcEw3jdcx48VT

# 数据库备份目录（运行账号可写）和 pg_dump 路径；定时、保留份数在「系统设置 → 数据备份」里配置
backup.dir=backups
backup.pg-dump=pg_dump

# 运维中心：通过 SSH 管理服务器（调用管理后台所在机器的 ssh 命令）
# 登录服务器的账号、私钥（所有主机共用，公钥加到每台服务器的 authorized_keys）
ops.ssh.user=root
ops.ssh.key=/root/.ssh/id_ed25519
# app.sh（拷到每个程序的 bin/）和 host_init.sh 所在目录，相对于工作目录（程序目录下的 ops-scripts/）
ops.script.dir=ops-scripts
# 上传的程序包暂存目录
ops.upload.dir=ops-upload
# 发布时程序目录 backup/ 下保留的旧版本数
ops.backup.keep=3
# 写给 Prometheus 的主机列表目录（file_sd：node.json、process.json），Prometheus 的 file_sd_configs 指向这里；为空时不写
ops.prometheus.targets-dir=
# 业务服务器上 node_exporter、process-exporter 的监听端口：「初始化」按它配置，主机列表按它写给 Prometheus
ops.exporter.node-port=9100
ops.exporter.process-port=9256
