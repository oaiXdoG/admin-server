# 接管：服务没在运行、但目录里有之前用 bin/start.sh（或旧的 host）在后台启动的进程时，先用 bin/stop.sh 停掉，再交给 systemd
- name: 检查服务状态
  ansible.builtin.command: "systemctl is-active danmu-{{ app_name }}"
  register: adopt_state
  changed_when: false
  failed_when: false

- name: 停掉不归 systemd 管的旧进程
  ansible.builtin.shell: |
    if [ -f "{{ app_dir }}/bin/stop.sh" ] && [ -f "{{ app_dir }}/app.pid" ]; then
      bash "{{ app_dir }}/bin/stop.sh"
    fi
  when: adopt_state.stdout != "active"
  register: adopt_stop
  changed_when: "'已停止' in adopt_stop.stdout"
