# 回滚到 backup/<backup>。vars：app_name、app_dir、backup
# 备份里有的 bin、lib、excel、conf 换回去；当前这些目录先移入 backup/<现在时间>，所以回滚本身也能再回滚
# 原来在运行的回滚后重新启动
- hosts: all
  gather_facts: false
  tasks:
    - name: 确认备份存在
      ansible.builtin.stat:
        path: "{{ app_dir }}/backup/{{ backup }}"
      register: target

    - name: 备份不存在
      ansible.builtin.fail:
        msg: "{{ app_dir }}/backup/{{ backup }} 不存在"
      when: not target.stat.exists

    - name: 确认服务存在
      ansible.builtin.import_tasks: tasks/unit.yml

    - name: 接管旧进程
      ansible.builtin.import_tasks: tasks/adopt.yml

    - name: 记录回滚前是否在运行
      ansible.builtin.command: "systemctl is-active danmu-{{ app_name }}"
      register: was_active
      changed_when: false
      failed_when: false

    - name: 停止
      ansible.builtin.systemd_service:
        name: "danmu-{{ app_name }}"
        state: stopped
      when: was_active.stdout == "active"

    - name: 换回备份
      ansible.builtin.shell: |
        set -e
        dir="{{ app_dir }}"
        from="$dir/backup/{{ backup }}"
        now="$dir/backup/$(date +%Y%m%d-%H%M%S)"
        for name in bin lib excel conf; do
          if [ -e "$from/$name" ]; then
            if [ -e "$dir/$name" ]; then mkdir -p "$now"; mv "$dir/$name" "$now/$name"; fi
            mv "$from/$name" "$dir/$name"
          fi
        done
        rmdir "$from" 2>/dev/null || true
        chmod +x "$dir"/bin/*.sh
        echo "已换回 {{ backup }}，当前版本备份为 $(basename "$now")"
      register: swapped

    - name: 回滚结果
      ansible.builtin.debug:
        msg: "{{ swapped.stdout }}"

    - name: 重新启动
      ansible.builtin.systemd_service:
        name: "danmu-{{ app_name }}"
        state: started
      when: was_active.stdout == "active"

    - name: 检查启动结果
      ansible.builtin.include_tasks: tasks/start_check.yml
      when: was_active.stdout == "active"
