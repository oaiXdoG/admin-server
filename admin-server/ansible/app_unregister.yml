# 删除程序登记：停止并删除 systemd 服务 danmu-<app_name>，不删除程序目录。vars：app_name
- hosts: all
  gather_facts: false
  tasks:
    - name: 停止并删除服务
      ansible.builtin.shell: |
        if [ -f /etc/systemd/system/danmu-{{ app_name }}.service ]; then
          systemctl disable --now danmu-{{ app_name }} || true
          rm -f /etc/systemd/system/danmu-{{ app_name }}.service
          systemctl daemon-reload
          echo removed
        fi
      register: removed
      changed_when: "'removed' in removed.stdout"
