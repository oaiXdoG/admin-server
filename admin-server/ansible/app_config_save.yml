# 保存 conf 下的文件，旧文件先备份到 backup-conf/<时间>/（不和发布的 backup 混在一起）；需要时保存后重启。vars：app_name、app_dir、file、content_b64、restart
- hosts: all
  gather_facts: false
  tasks:
    - name: 备份旧文件
      ansible.builtin.shell: |
        if [ -f "{{ app_dir }}/conf/{{ file }}" ]; then
          backup="{{ app_dir }}/backup-conf/$(date +%Y%m%d-%H%M%S)/$(dirname "{{ file }}")"
          mkdir -p "$backup" && cp -p "{{ app_dir }}/conf/{{ file }}" "$backup/" && echo "旧文件备份到 $backup"
        fi
      register: conf_backup

    - name: "保存 conf/{{ file }}"
      ansible.builtin.copy:
        dest: "{{ app_dir }}/conf/{{ file }}"
        content: "{{ content_b64 | b64decode }}"

    - name: 重启
      ansible.builtin.systemd_service:
        name: "danmu-{{ app_name }}"
        state: restarted
      when: restart | bool

    - name: 检查启动结果
      ansible.builtin.include_tasks: tasks/start_check.yml
      when: restart | bool
