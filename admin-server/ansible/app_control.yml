# 启动、停止、重启。vars：app_name、app_dir、app_action（start、stop、restart）
- hosts: all
  gather_facts: false
  tasks:
    - name: 确认服务存在
      ansible.builtin.import_tasks: tasks/unit.yml

    # 停止时也要执行：不归 systemd 管的旧进程只能用 bin/stop.sh 停掉
    - name: 接管旧进程
      ansible.builtin.import_tasks: tasks/adopt.yml

    - name: 确认已发布
      ansible.builtin.stat:
        path: "{{ app_dir }}/bin/start.sh"
      register: start_script
      when: app_action != 'stop'

    - name: 还没有发布
      ansible.builtin.fail:
        msg: "{{ app_dir }}/bin/start.sh 不存在，请先发布"
      when: app_action != 'stop' and not start_script.stat.exists

    - name: "systemctl {{ app_action }} danmu-{{ app_name }}"
      ansible.builtin.systemd_service:
        name: "danmu-{{ app_name }}"
        state: "{{ {'start': 'started', 'stop': 'stopped', 'restart': 'restarted'}[app_action] }}"

    - name: 检查启动结果
      ansible.builtin.include_tasks: tasks/start_check.yml
      when: app_action != 'stop'
